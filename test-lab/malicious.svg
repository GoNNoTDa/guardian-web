<?xml version="1.0" encoding="UTF-8"?>
<!-- Imitación de un adjunto SVG malicioso, INOFENSIVA: el script solo escribe
     un texto en el propio gráfico. No redirige, no descarga y no envía nada.
     Lo que se prueba es la FORMA (un "gráfico" que trae JavaScript dentro). -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <rect width="640" height="320" fill="#fdf6e3"/>
  <text x="24" y="48" font-family="system-ui, sans-serif" font-size="22" fill="#b0281a">
    Prueba: SVG con JavaScript dentro
  </text>
  <text x="24" y="84" font-family="system-ui, sans-serif" font-size="15" fill="#333">
    Esperado: «Esta imagen trae código» (+70).
  </text>
  <text x="24" y="112" font-family="system-ui, sans-serif" font-size="15" fill="#333">
    Un gráfico legítimo no necesita ejecutar código.
  </text>
  <text id="salida" x="24" y="160" font-family="monospace" font-size="14" fill="#1e7e45"></text>
  <text x="24" y="220" font-family="system-ui, sans-serif" font-size="13" fill="#666">
    Vuelve atrás para seguir con el laboratorio.
  </text>

  <script type="text/javascript"><![CDATA[
    // Carga inofensiva: solo demuestra que el código de un SVG se ejecuta.
    document.getElementById("salida").textContent =
      "El script del SVG se ha ejecutado (inofensivo).";
  ]]></script>
</svg>
