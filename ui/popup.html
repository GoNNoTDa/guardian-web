<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <img class="mark" src="../icons/icon48.png" alt="" />
      <span class="brand">Guardián Web</span>
      <button id="openPanel" class="icon" data-i18n-title="uPanelTip">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" /><path d="M14.5 4.5v15" /></svg>
      </button>
      <button id="openOptions" class="icon" data-i18n-title="uOptionsTip">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" /><circle cx="16" cy="7" r="2" /><circle cx="8" cy="17" r="2" /></svg>
      </button>
    </header>

    <main>
      <p id="host" class="host"></p>

      <div id="status" class="verdict safe">
        <p id="statusText" class="verdict-text" data-i18n="uAnalyzing">Analizando…</p>
        <p id="statusNote" class="verdict-note" hidden></p>
        <div id="meter" class="meter" hidden>
          <div class="track">
            <span id="meterFill" class="fill"></span>
            <span id="tickWarn" class="tick warn"></span>
            <span id="tickDanger" class="tick danger"></span>
          </div>
          <span id="score" class="score"></span>
        </div>
      </div>

      <ul id="reasons"></ul>
      <p id="empty" class="empty" data-i18n="uEmpty">No se han detectado señales de riesgo en esta pestaña.</p>

      <div class="site-actions">
        <button id="trustBtn" hidden></button>
        <button id="reportBtn" hidden data-i18n="uReport">Reportar este sitio</button>
      </div>
    </main>

    <section id="historySection">
      <div class="section-head">
        <h2 data-i18n="uHistoryTitle">Historial de avisos</h2>
        <button id="clearHistory" class="quiet" data-i18n="uClear">Borrar</button>
      </div>
      <ul id="history"></ul>
      <p id="historyEmpty" class="empty" data-i18n="uHistoryEmpty">Todavía no hay sitios marcados.</p>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
