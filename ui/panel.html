<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="panel">
    <header>
      <span id="shield">🛡️</span>
      <div>
        <h1>Guardián Web</h1>
        <span id="host"></span>
      </div>
      <button id="openOptions" data-i18n-title="uOptionsTip">⚙️</button>
      <button id="trustBtn" hidden></button>
    </header>

    <div id="status" class="safe" data-i18n="uAnalyzing">Analizando…</div>
    <ul id="reasons"></ul>
    <footer id="empty" data-i18n="uEmpty">No se han detectado señales de riesgo en esta pestaña.</footer>
    <div class="report-row"><button id="reportBtn" hidden data-i18n="uReport">Reportar este sitio</button></div>

    <section id="historySection">
      <div class="section-head">
        <h2 data-i18n="uHistoryTitle">Historial de avisos</h2>
        <button id="clearHistory" data-i18n="uClear">Borrar</button>
      </div>
      <ul id="history"></ul>
      <p id="historyEmpty" data-i18n="uHistoryEmpty">Todavía no hay sitios marcados.</p>
    </section>

    <script type="module" src="panel.js"></script>
  </body>
</html>
