<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="panel">
    <header>
      <span id="shield">🛡️</span>
      <div>
        <h1>Guardián Web</h1>
        <span id="host"></span>
      </div>
      <button id="openOptions" title="Opciones">⚙️</button>
      <button id="trustBtn" hidden></button>
    </header>

    <div id="status" class="safe">Analizando…</div>
    <ul id="reasons"></ul>
    <footer id="empty">No se han detectado señales de riesgo en esta pestaña.</footer>

    <section id="historySection">
      <div class="section-head">
        <h2>Historial de avisos</h2>
        <button id="clearHistory">Borrar</button>
      </div>
      <ul id="history"></ul>
      <p id="historyEmpty">Todavía no hay sitios marcados.</p>
    </section>

    <script type="module" src="panel.js"></script>
  </body>
</html>
