<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guardián Web</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <span class="shield">🛡️</span>
        <div>
          <h1>Guardián Web</h1>
          <p class="sub" data-i18n="oSubtitle">Ajustes de detección y privacidad</p>
        </div>
      </header>

      <section>
        <h2 data-i18n="oPrivacy">Privacidad</h2>
        <label class="row switch">
          <span>
            <b data-i18n="oLocalMode">Modo local</b>
            <small data-i18n="oLocalModeDesc">No consultar servicios externos.</small>
          </span>
          <input type="checkbox" id="localMode" />
        </label>
        <label class="row switch">
          <span>
            <b data-i18n="oNotif">Notificaciones del sistema</b>
            <small data-i18n="oNotifDesc">Avisar aunque no estés mirando la pestaña.</small>
          </span>
          <input type="checkbox" id="notifications" />
        </label>
        <label class="row switch">
          <span>
            <b data-i18n="oSearchGuard">Guardián de resultados de búsqueda</b>
            <small data-i18n="oSearchGuardDesc">Marca enlaces sospechosos en Google/Bing.</small>
          </span>
          <input type="checkbox" id="searchGuard" />
        </label>
      </section>

      <section id="apiSection">
        <h2><span data-i18n="oApiTitle">Claves de API</span> <small class="muted" data-i18n="oApiOptional">(opcional)</small></h2>
        <label class="row field">
          <span>
            <b data-i18n="oGsb">Google Safe Browsing</b>
            <small data-i18n="oGsbDesc">Clave gratuita desde Google Cloud Console.</small>
          </span>
          <input type="password" id="gsbKey" data-i18n-placeholder="oKeyPlaceholder" autocomplete="off" />
        </label>
        <label class="row field">
          <span>
            <b data-i18n="oUrlhaus">URLhaus (abuse.ch)</b>
            <small data-i18n="oUrlhausDesc">Auth-Key gratuito desde auth.abuse.ch.</small>
          </span>
          <input type="password" id="urlhausKey" data-i18n-placeholder="oKeyPlaceholder" autocomplete="off" />
        </label>
        <p class="note" id="localNote" data-i18n="oLocalNote" hidden>El modo local está activo: las claves no se usan.</p>
      </section>

      <section>
        <h2 data-i18n="oThresholds">Umbrales de aviso</h2>
        <label class="row field">
          <span><b data-i18n="oThWarn">Aviso naranja</b><small data-i18n="oThWarnDesc">Puntuación mínima para el banner de sospecha.</small></span>
          <input type="number" id="thWarning" min="10" max="500" step="5" />
        </label>
        <label class="row field">
          <span><b data-i18n="oThDanger">Aviso rojo</b><small data-i18n="oThDangerDesc">Puntuación mínima para el banner de peligro.</small></span>
          <input type="number" id="thDanger" min="10" max="500" step="5" />
        </label>
      </section>

      <section>
        <h2 data-i18n="oDetectors">Detectores activos</h2>
        <div id="detectors"></div>
      </section>

      <section>
        <h2><span data-i18n="oWhitelist">Sitios de confianza</span> <small class="muted" data-i18n="oWhitelistSub">(tu whitelist)</small></h2>
        <ul id="whitelist"></ul>
        <p id="whitelistEmpty" class="muted" data-i18n="oWhitelistEmpty">No has marcado ningún sitio como de confianza.</p>
      </section>

      <div class="actions">
        <button id="save" class="primary" data-i18n="oSave">Guardar cambios</button>
        <button id="reset" data-i18n="oReset">Restablecer valores por defecto</button>
        <span id="saved" class="saved" data-i18n="oSaved" hidden>✓ Guardado</span>
      </div>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
